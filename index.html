<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miracle Code · 奇迹代码 — Make a Wish</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#e8ecff;background:radial-gradient(ellipse at 50% 20%,#1a1f4a 0%,#0a0c24 45%,#020208 100%);overflow-x:hidden;min-height:100vh}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 18px 60px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.85}
.top button{background:transparent;border:1px solid #6b74c9;color:#cfd5ff;border-radius:20px;padding:5px 12px;cursor:pointer;margin-left:6px}
.brand{letter-spacing:4px;text-transform:uppercase;color:#a9b2ff}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(40px,9vw,76px);margin:26px 0 6px;background:linear-gradient(90deg,#ffe9a8,#ffffff,#b9a8ff,#ffe9a8);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite;text-shadow:0 0 40px rgba(255,220,150,.25)}
@keyframes sh{to{background-position:200%}}
.sub{color:#b8c0ff;margin-bottom:22px}
.wish{display:flex;gap:8px;margin:0 auto 22px;max-width:560px}
.wish input{flex:1;padding:14px 16px;border-radius:14px;border:1px solid #4a52a8;background:rgba(10,14,50,.65);color:#fff;font-size:16px;outline:none}
.wish input:focus{border-color:#ffd77a;box-shadow:0 0 18px rgba(255,215,122,.35)}
.mic{width:50px;border-radius:14px;border:1px solid #4a52a8;background:rgba(10,14,50,.65);color:#fff;font-size:20px;cursor:pointer}
.mic.on{background:#a0306a}
.reels{display:flex;justify-content:center;gap:clamp(10px,3vw,22px);margin:10px 0 26px}
.reel{width:clamp(84px,24vw,140px);height:clamp(110px,30vw,170px);border-radius:18px;background:linear-gradient(180deg,#05061a,#1b2160 50%,#05061a);border:2px solid #ffd77a;box-shadow:0 0 25px rgba(255,215,122,.35),inset 0 0 25px rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:clamp(46px,13vw,80px);color:#fff4d0;overflow:hidden;position:relative}
.reel.spin span{filter:blur(1.5px);opacity:.85}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 30%,transparent 70%,rgba(0,0,0,.55))}
.rl{font-size:12px;color:#9aa3e8;margin-top:6px}
.btns{display:flex;justify-content:center;gap:14px}
.btn{padding:14px 34px;font-size:17px;border-radius:40px;border:none;cursor:pointer;font-weight:600;letter-spacing:1px}
.go{background:linear-gradient(135deg,#ffd77a,#ff9a6b);color:#2a1300;box-shadow:0 0 22px rgba(255,180,100,.5)}
.stop{background:linear-gradient(135deg,#8f7bff,#4f6bff);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.hint{margin-top:16px;font-size:13px;color:#8d96d8}
/* result */
#result{display:none}
.frame{position:relative;margin-top:22px;padding:30px 22px;border-radius:26px;background:rgba(8,10,36,.82);text-align:left}
.frame::before{content:"";position:absolute;inset:-3px;border-radius:28px;padding:3px;background:conic-gradient(from var(--a,0deg),#ffd77a,#ff7ad9,#7a8bff,#7affea,#ffd77a);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 6s linear infinite;pointer-events:none}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes rot{to{--a:360deg}}
.frame .corner{position:absolute;pointer-events:none;font-size:22px;color:#ffd77a}
.c1{top:6px;left:10px}.c2{top:6px;right:10px}.c3{bottom:6px;left:10px}.c4{bottom:6px;right:10px}
.nums{text-align:center;font-family:Georgia,serif;font-size:22px;color:#ffe9a8;letter-spacing:6px}
.wishq{text-align:center;color:#c9cffd;font-style:italic;margin:6px 0 14px}
.score{text-align:center;margin:10px 0}
.ring{width:150px;height:150px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:conic-gradient(#ffd77a calc(var(--p)*1%),rgba(255,255,255,.08) 0)}
.ring div{width:124px;height:124px;border-radius:50%;background:#0a0c28;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring b{font-size:44px;font-family:Georgia,serif;color:#fff}
.ring small{font-size:12px;color:#ffd77a}
.hexes{display:flex;justify-content:space-around;gap:8px;margin:18px 0;text-align:center}
.hx{flex:1}.hx .t{font-size:12px;color:#9aa3e8}.hx .n{font-size:18px;color:#ffe9a8;margin-top:4px}.hx .e{font-size:11px;color:#aab}
.lines{display:flex;flex-direction:column-reverse;gap:4px;align-items:center;margin:6px auto;width:60px}
.ln{height:6px;width:60px;background:#ffd77a;border-radius:2px}.ln.yin{background:linear-gradient(90deg,#ffd77a 42%,transparent 42% 58%,#ffd77a 58%)}.ln.mv{box-shadow:0 0 8px #ff7ad9;background-color:#ff9ad9}
.ln.yin.mv{background:linear-gradient(90deg,#ff9ad9 42%,transparent 42% 58%,#ff9ad9 58%)}
h3{color:#ffd77a;margin:16px 0 6px;font-size:16px}
p,li{line-height:1.7;font-size:15px;color:#dde2ff}
ul{padding-left:20px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{font-size:12px;padding:4px 10px;border-radius:12px;background:rgba(122,139,255,.18);border:1px solid #4a52a8}
.prem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.prem button{padding:10px 4px;border-radius:12px;border:1px solid #6b5a2a;background:rgba(255,215,122,.08);color:#ffe9a8;cursor:pointer;font-size:14px}
.lock{display:none;margin-top:10px;padding:14px;border-radius:14px;border:1px dashed #ffd77a;background:rgba(255,215,122,.06);text-align:center}
.acts{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.acts button{padding:10px 18px;border-radius:24px;border:1px solid #6b74c9;background:rgba(20,24,70,.7);color:#fff;cursor:pointer}
.disc{margin-top:26px;font-size:12px;color:#7c84c4;line-height:1.6}
@media(max-width:480px){.prem{grid-template-columns:repeat(2,1fr)}.btn{padding:12px 24px}}
</style>
<style>.top select{background:rgba(10,14,50,.8);border:1px solid #6b74c9;color:#cfd5ff;border-radius:20px;padding:5px 10px;font-size:13px}</style>
<style>
.mic,.kbb{position:relative;width:54px;border-radius:14px;border:1px solid #5a4fc0;background:radial-gradient(circle at 50% 50%,#2b2170,#0b0e33 75%);cursor:pointer;overflow:visible;color:#fff;font-size:20px}
.mic::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,255,.45),rgba(70,110,255,.18) 45%,transparent 70%);filter:blur(6px);animation:halo 5.6s ease-in-out infinite;pointer-events:none}
.mic .star{position:absolute;inset:9px;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);background:radial-gradient(circle,#fff 0,#e3d4ff 18%,#a78bff 45%,#4f7bff 80%);animation:breath 5.6s ease-in-out infinite;filter:drop-shadow(0 0 6px #a78bff)}
.mic .star::after{content:"";position:absolute;inset:30%;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
.mic.on::before{animation-duration:1.1s;background:radial-gradient(circle,rgba(200,120,255,.75),rgba(80,120,255,.35) 45%,transparent 70%)}
.mic.on .star{animation:breath 1.1s ease-in-out infinite,spin 3s linear infinite}
@keyframes breath{0%,100%{transform:scale(.78);opacity:.8}50%{transform:scale(1.12);opacity:1;filter:drop-shadow(0 0 12px #8f7bff) drop-shadow(0 0 22px #4f7bff)}}
@keyframes halo{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.25);opacity:1}}
@keyframes spin{to{rotate:360deg}}
.kb{display:none;max-width:560px;margin:-10px auto 18px;padding:10px;border-radius:16px;background:rgba(14,16,58,.85);border:1px solid #4a52a8}
.kb.open{display:block}.kb .row{display:flex;justify-content:center;gap:4px;margin:4px 0;flex-wrap:wrap}
.kb button{min-width:28px;padding:8px 6px;border-radius:8px;border:1px solid #3d4598;background:#1a1f5c;color:#fff;font-size:15px;cursor:pointer}
.kb button:active{background:#7a6bff}.kb .w{min-width:110px}
.skyp{margin:26px auto 0;max-width:560px;padding:14px 16px;border-radius:16px;background:rgba(10,12,44,.55);border:1px solid rgba(122,139,255,.35);font-size:13px;color:#c9cffd;text-align:left;line-height:1.7}
.skyp b{color:#ffd77a;font-weight:600}.skyp .cl{color:#b9a8ff}
.go.running{background:linear-gradient(135deg,#8f7bff,#4f6bff);color:#fff;box-shadow:0 0 22px rgba(120,120,255,.6)}
.skyline{color:#b9a8ff;font-style:italic}
.stage2{margin-top:26px;padding:18px 14px 14px;border-radius:18px;border:1px solid rgba(255,215,122,.55);background:linear-gradient(180deg,rgba(255,215,122,.08),rgba(143,123,255,.08));box-shadow:0 0 24px rgba(255,215,122,.12)}.s2tag{display:inline-block;font-size:11px;letter-spacing:2px;padding:3px 10px;border-radius:10px;background:#ffd77a;color:#2a1300;font-weight:700}.stage2 h3{margin-top:10px}.s2p{font-size:13px;color:#c9cffd}
</style>
